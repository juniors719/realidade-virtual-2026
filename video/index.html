<html>
  <head>
    <title>Segunda experiência de RA usando o AR.js e o A-frame. Marcador Hiro e uma imagem.</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    
    <script>
      window.addEventListener('click', function () {
        var video = document.querySelector('#videolegal');
        if (video.paused) {
          video.play();
        }
      });
    </script>

    <video id="videolegal" src="legal.mp4" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display: none;"></video>
    
    <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false">
        <a-marker preset="hiro">
          <a-video src="#videolegal" width="1.7" height="1" rotation="-90 -90 0"></a-video>
        </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
    <div style="position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 1; color: white; font-family: sans-serif;">
      Toque na tela para iniciar o vídeo
    </div>

  </body>
</html>
