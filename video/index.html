<html>
  <head>
    <title>AR.js A-Frame Location-based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <div id="debug-info" style="position: fixed; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-family: sans-serif;">
      Aguardando sinal do GPS...
    </div>

    <script>
      window.onload = () => {
        let camera = document.querySelector('[gps-new-camera]');
        let debugDiv = document.getElementById('debug-info');

        // Escuta as atualizações de localização do dispositivo
        camera.addEventListener('gps-camera-update-position', e => {
            debugDiv.innerHTML = `GPS Conectado!<br>Lat: ${e.detail.position.latitude.toFixed(5)}<br>Lon: ${e.detail.position.longitude.toFixed(5)}`;
        });
      };
    </script>

    <a-scene vr-mode-ui='enabled: false' arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false' renderer='antialias: true; alpha: true'>
      <a-camera gps-new-camera='gpsMinDistance: 5'></a-camera>
      
      <a-entity material='color: red' geometry='primitive: box' gps-new-entity-place="latitude: -4.9800567206532; longitude: -39.05619337335449" scale="10 10 10"></a-entity>
    </a-scene>
  </body>
</html>
